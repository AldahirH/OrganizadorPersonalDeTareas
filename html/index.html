<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Tareas</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="ContenedorPrincipal">
        <header class="ContenedorTituloAplicacion">
            <div class="ContenedorTitulo">
                <svg xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-square-check ImagenTitulo"
                    aria-hidden="true">
                    <path d="m16 9-5.5 5.5L8 12"/>
                </svg>
                <h1>Mis Tareas</h1>
            </div>
            <p class="SubtituloAplicacion">Organiza tu día, una tarea a la vez.</p>
        </header>

        <div class="ContenedorPendientes">
            <div class="ContenedorTotalTareas TarjetaResumen">
                <svg xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round" 
                    class="lucide lucide-clipboard-list Icono IconoTotal">
                    <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/>
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                    <path d="M12 11h4"/>
                    <path d="M12 16h4"/>
                    <path d="M8 11h.01"/>
                    <path d="M8 16h.01"/>
                </svg>
                <div class="TextoResumen">
                    <h2>Total</h2>
                    <p class="CantidadTareas">0</p>
                </div>
            </div>
            <div class="ContenedorTareasPendientes TarjetaResumen">
                <svg xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round" 
                    class="lucide lucide-clock Icono IconoPendientes">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v6l4 2"/>
                </svg>
                <div class="TextoResumen">
                    <h2>Pendientes</h2>
                    <p class="CantidadTareas">0</p>
                </div>
            </div>
            <div class="ContenedorTareasCompletadas TarjetaResumen">
                <svg xmlns="http://www.w3.org/2000/svg" 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round" 
                    class="lucide lucide-circle-check Icono IconoCompletadas">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="m16 9-5.5 5.5L8 12"/>
                </svg>
                <div class="TextoResumen">
                    <h2>Completadas</h2>
                    <p class="CantidadTareas">0</p>
                </div>
            </div>
        </div>

        <div class="ContenedorAgregarTarea">
            <h2>Nueva Tarea</h2>
            <form class="ContenedorDefinirTarea">
                <div class="ContenedorFormularioTitulo ContenedorFormulario">
                    <label for="tarea">Título</label>
                    <input type="text" class="CampoFormulario" id="tarea" name="titulo" placeholder="¿Qué deseas hacer?">
                </div>
                <div class="ContenedorFormularioFecha ContenedorFormulario">
                    <label for="date">Fecha Límite</label>
                    <input type="date" class="CampoFormulario" id="date" name="fecha">
                </div>
                <button type="button" class="Boton BotonAgregarTarea">
                    <svg xmlns="http://www.w3.org/2000/svg" 
                        width="24" 
                        height="24" 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        stroke-width="2" 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        class="lucide lucide-plus">
                        <path d="M5 12h14"/>
                        <path d="M12 5v14"/>
                    </svg>
                    <span class="TextoBotonTarea">Agregar tarea</span>
                </button>
                <button type="button" class="Boton BotonCancelarEdicion" hidden>Cancelar edición</button>
            </form>
        </div>
        
        <div class="ContenedorMisTareas">
            <div class="ContenedorFiltros">
                <div class="ContenedorFiltroBusqueda">
                    <svg xmlns="http://www.w3.org/2000/svg" 
                        width="24" 
                        height="24" 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        stroke-width="2" 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        class="lucide lucide-search">
                        <path d="m21 21-4.34-4.34"/>
                        <circle 
                        cx="11" 
                        cy="11" 
                        r="8"/>
                    </svg>
                    <label for="buscar-tareas" class="SoloLectoresPantalla">Buscar tareas</label>
                    <input type="search" class="CampoFormulario" id="buscar-tareas" placeholder="Buscar tareas...">
                </div>
                <div class="ContenedorFiltrosTareas">
                    <button type="button" class="Boton BotonFiltroTareas BotonSeleccionado" aria-pressed="true" data-filtro="todos">Todos</button>
                    <button type="button" class="Boton BotonFiltroTareas" aria-pressed="false" data-filtro="pendientes">Pendientes</button>
                    <button type="button" class="Boton BotonFiltroTareas" aria-pressed="false" data-filtro="completadas">Completadas</button>
                </div>
            </div>

            <!-- Ejemplos estáticos para revisar los estados del diseño. -->
            <ul class="ContenedorTareas">
            </ul>
        </div>
    </main>
    <script src="/js/script.js"></script>
</body>
</html>
